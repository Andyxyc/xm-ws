name: OnePlus Storage Fix Build Smoke
run-name: oneplus-storage-build-smoke-${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches: [SukiSU-Ultra]
    paths: [.github/workflows/oneplus-storage-build-smoke.yml]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - oneplus_10_pro_b
          - oneplus_11_b
          - oneplus_13_b
          - oneplus_pad_lite_b
    steps:
      - name: Dispatch representative build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request

          repo = os.environ["REPO"]
          target = os.environ["TARGET"]
          sha = os.environ["HEAD_SHA"]
          base = "https://api.github.com/repos/" + repo
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers,
                                           method="GET" if body is None else "POST")
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          branch = "SukiSU-Ultra"
          if api("/git/ref/heads/" + branch)["object"]["sha"] != sha:
              raise SystemExit("Branch moved; refusing to dispatch stale smoke source")

          workflow = urllib.parse.quote("Build Kernel OnePlus.yml", safe="")
          path = "/actions/workflows/" + workflow
          before = {run["id"] for run in api(path + "/runs?per_page=50")["workflow_runs"]}
          inputs = dict(
              FILE=target,
              SUSFS_CI="Release",
              KPM="KPM",
              SUSFS_META="",
              DYNAMIC_REPO="Numbersf",
              BUILD_TIME="-1",
              SOURCE_PROFILE="",
              KSU_META="main/builtin/xiaomo/70fa0e092a2c81060823f8ae526eac14fdda2930",
              LZ4_UPDATE="false",
              ZRAM="0/lz4kd/8589934592",
              SUFFIX="-1",
              RESUBLEVEL="",
              FAST_BUILD="true",
              LSM_BBG="false",
              NETFILTER="true",
              CCM="false",
              UNICODE_BYPASS="true",
              SCHED_HMBIRD="false",
              DROID_SPACES="false",
              RE_KERNEL="false",
              SUSFS_DEV="false",
              SPACE_NOCLEAN="true",
              BUILD_NOCACHE="false",
          )
          api(path + "/dispatches", {"ref": branch, "inputs": inputs})

          for _ in range(36):
              time.sleep(5)
              runs = api(path + "/runs?per_page=50")["workflow_runs"]
              matches = [
                  run for run in runs
                  if run["id"] not in before and
                     run["head_sha"] == sha and
                     run["event"] == "workflow_dispatch"
              ]
              if matches:
                  # Multiple smoke jobs share SHA, so identify by target in display_title/run_name
                  target_matches = [
                      run for run in matches
                      if target.lower() in (run.get("display_title") or "").lower() or
                         target.lower() in (run.get("name") or "").lower()
                  ]
                  chosen = target_matches[0] if target_matches else matches[0]
                  print(json.dumps({
                      "target": target,
                      "run_id": chosen["id"],
                      "url": chosen["html_url"],
                      "status": chosen["status"],
                  }, indent=2))
                  break
          else:
              raise SystemExit("Dispatch accepted but run receipt was not found")
