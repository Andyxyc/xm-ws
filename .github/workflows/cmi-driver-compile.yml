name: CMI audio and WLAN kernel build
on:
  push:
    branches: [cmi-miui12510-driver-build-20261019]
    paths: ['build-cmi-drivers.sh', 'repair-cmi-wlan.py', 'repair-cmi-sysfs.py', 'repair-cmi-link.py', '.github/workflows/cmi-driver-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cmi-driver-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    name: 小米10Pro音频与无线驱动整核编译
    if: github.ref == 'refs/heads/cmi-miui12510-driver-build-20261019'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 安装编译依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git curl unzip bc bison flex libssl-dev libelf-dev libtinfo5 libncurses5 python3 python-is-python3 cpio rsync
      - name: 校验固定源码并实际编译
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CMI_HOST_SANITIZERS: address,undefined
        run: |
          set -euo pipefail
          python3 -m py_compile repair-cmi-wlan.py repair-cmi-sysfs.py repair-cmi-link.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-cmi-drivers.sh')
          source = p.read_text()
          anchor = 'export ARCH=arm64 TARGET_PRODUCT=cmi TARGET_BUILD_VARIANT=user\n'
          if source.count(anchor) != 1:
              raise SystemExit('build entry changed; inspect before applying repair')
          repair = 'python3 "$ROOT/repair-cmi-wlan.py" "$WORK/kernel" "$ROOT/driver-results"\n'
          repair += 'python3 "$ROOT/repair-cmi-sysfs.py" "$WORK/kernel" "$ROOT/driver-results"\n'
          repair += 'python3 "$ROOT/repair-cmi-link.py" apply "$WORK/kernel" "$ROOT/driver-results"\n'
          p.write_text(source.replace(anchor, repair + anchor))
          PY
          bash -n build-cmi-drivers.sh
          bash build-cmi-drivers.sh
      - name: 核验最终链接与产物
        shell: bash
        run: |
          set -euo pipefail
          python3 repair-cmi-link.py verify "$RUNNER_TEMP/cmi-driver-baseline/out" "$GITHUB_WORKSPACE/driver-results"
      - name: 保存实际入口及错误摘要
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p driver-results
          cp build-cmi-drivers.sh repair-cmi-wlan.py repair-cmi-sysfs.py repair-cmi-link.py driver-results/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('driver-results/build.log')
          errors = []
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              needles = ('error:', 'error ', 'traceback', 'undefined reference', 'multiple definition', 'runtimeerror', 'assertionerror', 'version generation failed')
              errors = list(dict.fromkeys(s for s in lines if any(n in s.lower() for n in needles)))
              Path('driver-results/error-summary.txt').write_text('\n'.join(errors[-40:]) + '\n')
          report = Path('driver-results/kernel-link-verification.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              if report.exists():
                  verified = json.loads(report.read_text())
                  f.write('### 驱动基线链接核验\n' + verified['kernel_link'] + '\n\n')
                  f.write('该基线不含 SukiSU / SUSFS，不是刷机包，尚未实机测试。\n\n')
              else:
                  f.write('### 未完成最终链接核验\n\n')
              f.write('```text\n' + '\n'.join(errors[-20:]) + '\n```\n')
          PY
      - name: 保存完整日志与可得产物
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmi-driver-baseline-${{ github.run_id }}
          path: driver-results/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3
