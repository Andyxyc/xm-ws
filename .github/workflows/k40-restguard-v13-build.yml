name: K40 event night mode v1.3
on:
  push:
    branches: [codex/k40-battery-senior-20261126]
    paths: [.github/workflows/k40-restguard-v13-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Compile owner rest reminder without online dependencies
        run: |
          set -euo pipefail
          mkdir guard delivery
          python3 - <<'PY2'
          import pathlib,zipfile,io,base64,hashlib
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='cddd36b8ec828e98ff2656df5e71daa6fccc5f8920746bcd78230d81ebde4d69'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:z.extractall('guard')
          PY2
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          android_jar="$(find "$sdk/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir guard/classes guard/dex guard/tests
          javac -d guard/tests guard/TouchParser.java guard/TouchParserTest.java guard/ThermalPolicy.java guard/ThermalPolicyTest.java guard/CriticalRebootPolicy.java guard/CriticalRebootPolicyTest.java guard/ThermalEpisode.java guard/ThermalEpisodeTest.java guard/NightPolicy.java guard/NightPolicyTest.java
          java -cp guard/tests local.k40.restguard.TouchParserTest
          java -cp guard/tests local.k40.restguard.ThermalPolicyTest
          java -cp guard/tests local.k40.restguard.CriticalRebootPolicyTest
          java -cp guard/tests local.k40.restguard.ThermalEpisodeTest
          java -cp guard/tests local.k40.restguard.NightPolicyTest
          javac -source 17 -target 17 -classpath "$android_jar" -d guard/classes guard/TouchParser.java guard/ThermalPolicy.java guard/CriticalRebootPolicy.java guard/CriticalCpuResponse.java guard/ThermalEpisode.java guard/ThermalEpisodeTest.java guard/CpuThermalListener.java guard/NightPolicy.java guard/NightPolicyTest.java guard/NightGuard.java guard/NightControl.java guard/RestGuard.java guard/WarningActivity.java guard/TestActivity.java
          "$tools/d8" --min-api 33 --lib "$android_jar" --output guard/dex $(find guard/classes -name '*.class')
          "$tools/aapt2" link -I "$android_jar" --manifest guard/AndroidManifest.xml -o guard/unsigned.apk
          (cd guard/dex && zip ../unsigned.apk classes.dex)
          "$tools/zipalign" -p 4 guard/unsigned.apk delivery/K40-RestGuard-unsigned.apk
          cp "$tools/lib/apksigner.jar" delivery/
          cp guard/dex/classes.dex delivery/
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" -Oz -Wall -Wextra -Werror -fPIE -pie guard/night-timer.c -o delivery/k40-night-timer
          sha256sum delivery/* > delivery/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: K40-RestGuard-unsigned
          path: delivery/
          retention-days: 7
