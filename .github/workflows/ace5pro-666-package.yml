name: Ace5Pro install validation and AK3 package
run-name: Ace5Pro 6.6.66 installer validation and package
on:
  push:
    branches: [ace5pro-666-package-20261101]
    paths: ['ace5pro666/**', 'ace5pro-validation/**', '.github/workflows/ace5pro-666-package.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate official AK3 entry and UI output including real Unix sockets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('ace5pro666/ace-install.sh').read_bytes()).hexdigest()=='a353c4d812dd791e39dade6d254d5aefe696f91f2fd9ef894e19726e27a8de4a'
          print('Exact writer already passed 21 actual loop-device cases in run 41230730260.')
          PY
          python3 ace5pro-validation/prepare_entry.py
          python3 ace5pro-validation/test_ak3_ui_output.py --backend entry-check/update-binary --core entry-check/ak3-core.sh --output ui-output.json
          python3 ace5pro-validation/test_official_ak3_entry_linux.py --ak3 entry-check --output official-entry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ace5Pro-official-AK3-entry-${{ github.run_id }}
          path: |
            ui-output.json
            official-entry.json
  package:
    needs: install-check
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the already running kernel compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 41231027191 --repo Andyxyc/xm-ws --exit-status || true
      - uses: actions/download-artifact@v4
        with:
          name: Ace5Pro-666-candidate-41231027191
          run-id: 41231027191
          github-token: ${{ github.token }}
          path: retained
      - name: Restore completed compilation without rebuilding it
        run: python3 ace5pro-validation/restore_compilation.py
      - name: Repackage and check
        run: |
          git init -q kernel-work/AnyKernel3
          git -C kernel-work/AnyKernel3 remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C kernel-work/AnyKernel3 fetch -q --depth=1 origin 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          git -C kernel-work/AnyKernel3 checkout -q --detach FETCH_HEAD
          python3 ace5pro666/package.py kernel-work/common kernel-work/AnyKernel3 build-result/Image.kpm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ace5Pro-666-AK3-${{ github.run_id }}
          path: |
            deliverables/*
            build-result/*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
