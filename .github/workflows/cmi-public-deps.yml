name: CMI public compiler and drivers
on:
  push:
    branches: [cmi-miui12510-driver-build-20261019]
    paths: ['ci/cmi/fetch-public-deps.sh', '.github/workflows/cmi-public-deps.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmi-public-deps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependencies:
    name: 获取并验证公开编译依赖
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 安装运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl libtinfo5 libncurses5 binutils gzip tar
      - name: 获取固定版本并执行ARM64编译链接探针
        run: bash ci/cmi/fetch-public-deps.sh
      - name: 保存已验证的公开依赖
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmi-public-deps-${{ github.run_id }}
          path: public-deps/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
