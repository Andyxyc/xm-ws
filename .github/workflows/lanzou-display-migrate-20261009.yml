name: OnePlus Lanzou Chinese Folder and Display Rename 20261009
run-name: Restore ASCII ZIP names and preserve Chinese model folders - ${{ github.run_id }}
on:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/lanzou-display-migrate-20261009.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oneplus-lanzou-display-migrate-20261009
  cancel-in-progress: false

jobs:
  rename-owned-ak3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: SukiSU-Ultra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax and cloud credentials
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/lanzou_display_names.py scripts/lanzou_migrate_display_20261009.py scripts/publish_lanzou_ak3.py
          [[ -n "$LANZOU_YLOGIN" && -n "$LANZOU_PHPDISK_INFO" ]]
      - name: Install pinned cloud client
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'requests==2.32.5' 'requests-toolbelt==1.0.0' setuptools
          python -m pip install --disable-pip-version-check --no-cache-dir --no-build-isolation 'git+https://github.com/zaxtyson/LanZouCloud-API.git@3bb917f6baf873d83b1e8e6fb2df74c60c4d8cb3'
      - name: Ensure previous migration is no longer writing cloud names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37924350731" --jq '.status')
          if [[ "$prior_status" != "completed" ]]; then
            echo "::error::Earlier naming migration is still active; refusing concurrent cloud edits"
            exit 10
          fi
          echo "Original naming migration completed; reconciliation may proceed"
      - name: Verify planned changes against current remote state
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          LANZOU_PHPSESSID: ${{ secrets.LANZOU_PHPSESSID }}
        run: |
          python scripts/lanzou_migrate_display_20261009.py --dry-run
          cp lanzou-display-rename-report.json lanzou-display-preflight.json
      - name: Apply only planned AK3 filename and device folder renames
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          LANZOU_PHPSESSID: ${{ secrets.LANZOU_PHPSESSID }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/lanzou_migrate_display_20261009.py
      - name: Preserve non-secret receipts and rollback mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus-lanzou-display-migration-${{ github.run_id }}
          path: |
            lanzou-display-preflight.json
            lanzou-display-rename-report.json
          if-no-files-found: warn
          retention-days: 7
