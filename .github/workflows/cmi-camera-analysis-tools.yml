name: CMI camera analysis toolchain
on:
  push:
    branches: [cmi-miui12510-driver-build-20261019]
    paths: [.github/workflows/cmi-camera-analysis-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    if: github.ref == 'refs/heads/cmi-miui12510-driver-build-20261019'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build public analysis dependencies without device inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheels
          python -m pip wheel --retries 2 --wheel-dir wheels vmlinux-to-elf==1.3.5 capstone==5.0.3 pyelftools==0.32 keystone-engine==0.9.2 unicorn==2.1.2
          python -m pip install --no-index --find-links wheels vmlinux-to-elf==1.3.5 capstone==5.0.3 pyelftools==0.32 keystone-engine==0.9.2 unicorn==2.1.2
          python -m pip freeze > wheels/DEPENDENCIES.txt
          sha256sum wheels/*.whl > wheels/SHA256SUMS
          vmlinux-to-elf --help > wheels/TOOL-HELP.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmi-camera-analysis-tools-${{ github.run_id }}
          path: wheels/
          retention-days: 1
          if-no-files-found: error
