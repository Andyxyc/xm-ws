name: Lanzou Publisher Security Test
on:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/lanzou-publisher-security-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: SukiSU-Ultra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python and redirect safety without credentials
        run: |
          python -m py_compile scripts/publish_lanzou_ak3.py scripts/backfill_lanzou_ak3_20261009.py
          python -m pip install -q 'requests==2.32.5'
          python - <<'PY'
          import runpy,sys,types
          from urllib.parse import urljoin
          api=types.ModuleType('lanzou.api')
          mod=types.ModuleType('lanzou')
          class Base:
              def __init__(self):
                  self._headers={'User-Agent':'test'}
                  self._timeout=3
                  self._session=None
          api.LanZouCloud=Base
          sys.modules['lanzou']=mod
          sys.modules['lanzou.api']=api
          lib=runpy.run_path('scripts/publish_lanzou_ak3.py')
          make=lib['make_secure_client']
          Err=lib['PublishError']
          base='https://pc.woozooo.com/account.php'
          class Resp:
              def __init__(self,code,location=None):
                  self.status_code=code
                  self.is_redirect=300<=code<=399
                  self.headers={'Location':location} if location else {}
              def raise_for_status(self):
                  if self.status_code>=400: raise RuntimeError('unavailable')
          class Session:
              def __init__(self,values):
                  self.values=values
                  self.urls=[]
              def request(self,method,url,**kwargs):
                  assert kwargs['allow_redirects'] is False
                  assert kwargs['verify'] is True
                  self.urls.append(url)
                  return self.values[url]
          def check(route,method='GET',blocked=False,n=None):
              c=make()
              c._session=Session(route)
              try:
                  c._safe_request(method,base)
                  assert not blocked, 'expected rejection'
              except Err:
                  assert blocked, 'unexpected rejection'
              if n is not None: assert len(c._session.urls)==n, c._session.urls
              return c._session.urls
          check({base:Resp(200)},n=1)
          same=base+'?action=login'
          check({base:Resp(302,same),same:Resp(200)},n=2)
          check({base:Resp(302,'https://malicious.example/path')},blocked=True,n=1)
          check({base:Resp(302,'http://pc.woozooo.com/login')},blocked=True,n=1)
          check({base:Resp(302,same)},'POST',blocked=True,n=1)
          check({base:Resp(302,base)},blocked=True,n=4)
          try:
              make().delete(1)
              assert False,'delete must be blocked'
          except Err: pass
          print('PASS: python syntax and seven isolated redirect/delete safety tests')
          PY

      - name: Check optional session Cookie forwarding without network
        run: |
          python - <<'PY'
          import os,runpy,sys
          mod=runpy.run_path('scripts/publish_lanzou_ak3.py')
          func=mod['main']
          ns=func.__globals__
          ns['select_artifact']=lambda *args: (
              {'id':12,'name':'AnyKernel3_SukiSUUltra_40959_OnePlusAce5Race_Android16'},
              ('OnePlusAce5Race','OnePlusAce5Race_test')
          )
          ns['fetch_artifact']=lambda *args: None
          ns['make_flashable_zip']=lambda *args: {'sha256':'test','size_bytes':1,'member_count':3}
          ns['make_secure_client']=lambda: object()
          received=[]
          def publish(client,zip_path,model,cookies):
              received.append(cookies.copy())
              return {'folder':'test','remote_name':'test','remote_file_id':123}
          ns['publish_to_lanzou']=publish
          sys.argv=['publish','--repo','Andyxyc/xm-ws','--run-id','37884290075']
          os.environ.update(GH_TOKEN='fake-token',LANZOU_YLOGIN='123456',
                            LANZOU_PHPDISK_INFO='test-only-value')
          os.environ.pop('LANZOU_PHPSESSID',None)
          assert func()==0
          assert received.pop(0)=={'ylogin':'123456','phpdisk_info':'test-only-value'}
          os.environ['LANZOU_PHPSESSID']='fake_session_test'
          assert func()==0
          assert received.pop(0)=={'ylogin':'123456','phpdisk_info':'test-only-value',
                                   'PHPSESSID':'fake_session_test'}
          print('PASS: optional third Cookie forwarded only when configured')
          PY

      - name: Test real-folder-API login check without network
        run: |
          python - <<'PY'
          import runpy,sys,types
          api=types.ModuleType('lanzou.api')
          module=types.ModuleType('lanzou')
          class Base:
              SUCCESS=0
              FAILED=-1
              NETWORK_ERROR=9
              def __init__(self):
                  self._headers={'User-Agent':'test'}
                  self._timeout=2
                  self._doupload_url='https://pc.woozooo.com/doupload.php'
          api.LanZouCloud=Base
          sys.modules['lanzou']=module
          sys.modules['lanzou.api']=api
          bundle=runpy.run_path('scripts/publish_lanzou_ak3.py')
          class Cookies(dict):
              pass
          class Response:
              status_code=200
              is_redirect=False
              headers={}
              def __init__(self,data):
                  self.data=data
              def raise_for_status(self):
                  pass
              def json(self):
                  return self.data
          class Session:
              def __init__(self,data):
                  self.data=data
                  self.cookies=Cookies()
                  self.requests=[]
              def request(self,method,url,**kwargs):
                  assert method=='POST'
                  assert url=='https://pc.woozooo.com/doupload.php?uid=123456'
                  assert kwargs['data']=={'task':47,'folder_id':-1}
                  assert kwargs['verify'] is True
                  assert kwargs['allow_redirects'] is False
                  self.requests.append(url)
                  return Response(self.data)
          expected={'ylogin':'123456','phpdisk_info':'test-cookie'}
          for payload,code in [
              ({'zt':1,'info':[],'text':[]},Base.SUCCESS),
              ({'zt':9,'info':'','text':''},Base.FAILED),
              ({'zt':1,'info':[],'text':'invalid'},Base.FAILED)
          ]:
              client=bundle['make_secure_client']()
              session=Session(payload)
              client._session=session
              assert client.login_by_cookie(expected)==code
              assert session.cookies==expected
              assert len(session.requests)==1
          print('PASS: read-only LanZouCloud authentication accepts zt=1 only')
          PY
