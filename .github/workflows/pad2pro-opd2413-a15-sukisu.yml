name: Pad2Pro OPD2413 A15 6.6.57 Official SukiSU KPM
run-name: OPD2413 A15 6.6.57 SukiSU KPM - ${{ github.run_id }}
on:
  workflow_dispatch:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/pad2pro-opd2413-a15-sukisu.yml
      - scripts/build_pad2pro.py
      - templates/anykernel_pad2pro.sh
permissions:
  contents: read
concurrency:
  group: pad2pro-opd2413-a15-6657
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate build and installer syntax
        run: |
          set -euo pipefail
          mkdir -p pad2pro_diagnostics
          python3 -m py_compile scripts/build_pad2pro.py
          python3 scripts/build_pad2pro.py selftest | tee pad2pro_diagnostics/selftest.log
          dash -n templates/anykernel_pad2pro.sh
          bash -n scripts/ace5pro_fix_uapi5.sh
      - name: Install compilation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make gcc g++ bison flex bc libssl-dev libelf-dev zlib1g-dev dwarves cpio xz-utils zip unzip lz4 zstd python3 curl
          df -h . | tee pad2pro_diagnostics/disk.log
      - name: Prepare official OPD2413 sources and latest pinned SukiSU
        run: |
          set -euo pipefail
          python3 -u scripts/build_pad2pro.py prepare 2>&1 | tee pad2pro_diagnostics/prepare.log
      - name: Build unchanged stock-source ABI reference
        run: |
          set -euo pipefail
          python3 -u scripts/build_pad2pro.py stock 2>&1 | tee pad2pro_diagnostics/stock.log
      - name: Build SukiSU KPM SUSFS kernel and compare exported ABI
        run: |
          set -euo pipefail
          python3 -u scripts/build_pad2pro.py custom 2>&1 | tee pad2pro_diagnostics/custom.log
      - name: Package only after kernel and ABI gates pass
        run: |
          set -euo pipefail
          cp templates/anykernel_pad2pro.sh pad2pro_work/ak3/anykernel.sh
          chmod 755 pad2pro_work/ak3/anykernel.sh
          dash -n pad2pro_work/ak3/anykernel.sh
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          base=Path('pad2pro_work/ak3')
          diag=Path('pad2pro_diagnostics')
          result=json.loads((diag/'custom-build.json').read_text())
          if result['abi_gate'] != 'passed':
              raise SystemExit('Kernel ABI verification did not pass')
          version=json.loads((diag/'sukisu-version.json').read_text())['version']
          for p in ['Image','anykernel.sh','tools/ak3-core.sh','META-INF/com/google/android/update-binary']:
              if not (base/p).is_file() or (base/p).stat().st_size == 0:
                  raise SystemExit('Missing required AK3 file: '+p)
          digest=hashlib.sha256((base/'Image').read_bytes()).hexdigest()
          if digest != result['image_sha256']:
              raise SystemExit('Packaged Image differs from checked KPM output')
          (base/'Image.sha256').write_text(digest+'  Image\n')
          info=json.loads((diag/'sources.json').read_text())
          info.update(sukisu_version=version, kpm='enabled', susfs='v2.3.0', abi_gate='stock-source comparison passed', device_boot_test='not_performed')
          (base/'build-info.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          out=Path('pad2pro_dist'); out.mkdir()
          target=out/f'OPD2413_A15_6.6.57_SukiSU{version}_KPM_SUSFS_UNTESTED_{os.environ["GITHUB_RUN_ID"]}.zip'
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(base.rglob('*')):
                  rel=p.relative_to(base)
                  if '.git' not in rel.parts and p.is_file():
                      z.write(p,rel.as_posix())
          with zipfile.ZipFile(target) as z:
              if z.testzip() is not None:
                  raise SystemExit('ZIP CRC verification failed')
              if hashlib.sha256(z.read('Image')).hexdigest() != digest:
                  raise SystemExit('Image content failed ZIP readback')
          checksum=hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_suffix('.zip.sha256').write_text(checksum+'  '+target.name+'\n')
          print('Artifact:',target)
          print('SukiSU:',version)
          print('SHA256:',checksum)
          print('Runtime compatibility with actual .801 firmware and boot: NOT TESTED')
          PY
      - name: Preserve complete diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OPD2413-diagnostics-${{ github.run_id }}
          path: pad2pro_diagnostics/
          if-no-files-found: error
          retention-days: 30
      - name: Upload compiled candidate
        uses: actions/upload-artifact@v4
        with:
          name: OPD2413-A15-6.6.57-SukiSU-KPM-Candidate-${{ github.run_id }}
          path: pad2pro_dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
