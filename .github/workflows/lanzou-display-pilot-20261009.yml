name: OnePlus Lanzou Display Pilot
on:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/lanzou-display-pilot-20261009.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rename-ace5-race-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: SukiSU-Ultra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python and cloud credentials
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/lanzou_migrate_display_20261009.py
          [[ -n "$LANZOU_YLOGIN" && -n "$LANZOU_PHPDISK_INFO" ]]
      - name: Install pinned cloud library
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'requests==2.32.5' 'requests-toolbelt==1.0.0' setuptools
          python -m pip install --disable-pip-version-check --no-cache-dir --no-build-isolation 'git+https://github.com/zaxtyson/LanZouCloud-API.git@3bb917f6baf873d83b1e8e6fb2df74c60c4d8cb3'
      - name: Test one known model and verify changes
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          LANZOU_PHPSESSID: ${{ secrets.LANZOU_PHPSESSID }}
        run: |
          python scripts/lanzou_migrate_display_20261009.py --model OnePlusAce5Race
      - name: Save cloud mutation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanzou-display-pilot-${{ github.run_id }}
          path: lanzou-display-rename-report.json
          retention-days: 7
          if-no-files-found: warn
