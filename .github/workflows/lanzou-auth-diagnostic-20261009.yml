name: Lanzou read-only auth check
on:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/lanzou-auth-diagnostic-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare anonymous and authenticated read-only folder requests
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        run: |
          python - <<'PY'
          import os, urllib.parse
          import requests
          ylogin=os.environ.get('LANZOU_YLOGIN','')
          info=os.environ.get('LANZOU_PHPDISK_INFO','')
          if not ylogin or not info:
              raise SystemExit('Missing authentication secret')
          if not ylogin.isdecimal():
              print('ylogin_format_invalid_expected_digits')
              raise SystemExit(2)
          hdr={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36',
               'Referer':'https://pc.woozooo.com/mydisk.php',
               'Accept-Language':'zh-CN,zh;q=0.9'}
          for label, use_cookie in [('anonymous',False),('with_secrets',True)]:
              s=requests.Session()
              if use_cookie:
                  s.cookies.set('ylogin',ylogin,domain='pc.woozooo.com',path='/')
                  s.cookies.set('phpdisk_info',info,domain='pc.woozooo.com',path='/')
              for endpoint,method in [('mydisk.php','GET'),('doupload.php','POST')]:
                  url='https://pc.woozooo.com/'+endpoint
                  kwargs={'headers':hdr,'timeout':18,'allow_redirects':False,'verify':True}
                  if method=='POST':
                      url+='?uid='+ylogin
                      kwargs['data']={'task':47,'folder_id':-1}
                  try:
                      r=s.request(method,url,**kwargs)
                  except requests.RequestException as exc:
                      print(label,endpoint,'request_error',type(exc).__name__,flush=True)
                      continue
                  loc=r.headers.get('Location','')
                  tgt=urllib.parse.urlsplit(urllib.parse.urljoin(url,loc)) if loc else None
                  output={'actor':label,'endpoint':endpoint,'http_status':r.status_code,
                          'redirect_host':tgt.hostname if tgt else None,
                          'redirect_path':tgt.path if tgt else None,
                          'content_type':r.headers.get('Content-Type','').split(';')[0],
                          'login_form':('网盘用户登录' in r.text)}
                  try:
                      j=r.json()
                      output.update(json_type=type(j).__name__,
                                    json_keys=sorted(j.keys()) if isinstance(j,dict) else [],
                                    zt=j.get('zt') if isinstance(j,dict) else None,
                                    info_type=type(j.get('info')).__name__ if isinstance(j,dict) else None,
                                    text_type=type(j.get('text')).__name__ if isinstance(j,dict) else None,
                                    text_count=len(j['text']) if isinstance(j,dict) and isinstance(j.get('text'),list) else None)
                  except ValueError: pass
                  print('RESULT',output,flush=True)
          PY
