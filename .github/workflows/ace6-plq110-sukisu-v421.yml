name: Ace6 PLQ110 SukiSU v4.2.1 SUSFS build
run-name: Ace6 PLQ110 6.6.118 SukiSU v4.2.1 #${{ github.run_number }}

on:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/ace6-plq110-sukisu-v421.yml
      - scripts/ace6_susfs_v421_compat.py
      - scripts/ace6_susfs_v421_abi_bridge.py
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ace6-plq110-v421-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # One device: permit upstream's direct-download toolchain fallback on mirror miss.
      OP_TOTAL_DEVICES: '1'
      # Required even for a clean build: the upstream composite action probes both.
      CCACHE_DIR: ${{ github.workspace }}/.ccache_ace6
      LDCACHE_DIR: ${{ github.workspace }}/.ld_cache_ace6
      CCACHE_MAXSIZE: 10G
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
      CCACHE_IS_KERNEL_COMPILING: 'true'
      OP_SPOOF_UNAME: 'false'
    steps:
      - name: Checkout reviewed OnePlus build pipeline
        uses: actions/checkout@v4
        with:
          repository: Bouteillepleine/SukiSu_Ultra_Oneplus-
          ref: 4f677f6f1ca5ecb079741dd68f78324754dca75b
          persist-credentials: false

      - name: Checkout pinned Ace6 SukiSU compatibility adapter
        uses: actions/checkout@v4
        with:
          repository: Andyxyc/xm-ws
          ref: ${{ github.sha }}
          path: ace6-patches
          persist-credentials: false

      - name: Validate and apply pinned native execveat ABI reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ace6-patches/scripts/ace6_susfs_v421_compat.py ace6-patches/scripts/ace6_susfs_v421_abi_bridge.py
          python3 ace6-patches/scripts/ace6_susfs_v421_abi_bridge.py --selftest
          python3 ace6-patches/scripts/ace6_susfs_v421_compat.py --selftest
          python3 ace6-patches/scripts/ace6_susfs_v421_compat.py --apply configs/apply_susfs_patches.sh
          bash -n configs/apply_susfs_patches.sh
          grep -q 'ACE6_V421_KSUD_ABI_ONLY_REJECT_GUARD_20261016' configs/apply_susfs_patches.sh

      - name: Prepare exact OnePlus Ace 6 configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('configs/a16/OP-ACE-6.json')
          assert p.is_file(), 'Upstream OP-ACE-6 configuration not found'
          j=json.loads(p.read_text())
          expected={'model':'OP-ACE-6','soc':'sun',
                    'branch':'wild/sm8750','manifest':'oneplus_ace_6_w.xml',
                    'android_version':'android15','kernel_version':'6.6',
                    'os_version':'A16'}
          for key,value in expected.items():
              assert j.get(key)==value, f'Upstream changed {key}: {j.get(key)!r}'
          m=Path('manifests/a16/oneplus_ace_6_w.xml')
          assert m.is_file(), 'Official OnePlus Ace 6 source manifest absent'
          xml=m.read_text()
          assert 'oneplus/sm8750_b_16.0.0_ace_6' in xml, 'Unexpected kernel source branch'
          # Keep HMBIRD interfaces required by the stock SM8750 vendor tree;
          # disable all other optional kernel/network/scheduler enhancements.
          j.update(hmbird=True,susfs=True,opt=False,ds=False,bbg=False,
                   bbr=False,bbr3=False,ttl=False,ip_set=False,unicode=False,
                   ntsync=False,lto='thin',rust_build=False,disk_cleanup=False)
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(j,ensure_ascii=False,indent=2))
          PY
          echo "json=$(jq -c . configs/a16/OP-ACE-6.json)" >> "$GITHUB_OUTPUT"
          test "$(jq -r .model configs/a16/OP-ACE-6.json)" = OP-ACE-6
          test "$(jq -r .kernel_version configs/a16/OP-ACE-6.json)" = 6.6

      - name: Free build-runner disk space
        uses: ./.github/actions/disk-cleanup

      - name: Install upstream build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc \
            dos2unix kmod libdw-dev elfutils pigz aria2
          mkdir -p "$CCACHE_DIR" "$LDCACHE_DIR"
          ccache --max-size=10G
          df -h "$GITHUB_WORKSPACE"

      - name: Compile SukiSU + SUSFS into real Image and AK3
        id: build
        uses: Bouteillepleine/SukiSu_Ultra_Oneplus-/.github/actions/build-kernel@4f677f6f1ca5ecb079741dd68f78324754dca75b
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          ksu_type: SUKISU
          ksu_branch_or_hash: fd2a85151c8312fd9b4237db9ba827dcea692228
          susfs_commit_hash_or_branch: a0f9c59e2243f8a5db955f4ad1686d5e0ad26e1a
          optimize_level: O2
          clean: true
          debug: false
          enable_adios: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any built artifact or version is wrong
        shell: bash
        env:
          BUILT_KERNEL: ${{ steps.build.outputs.kernel_version }}
          BUILT_KSU: ${{ steps.build.outputs.ksu_version }}
          BUILT_SUSFS: ${{ steps.build.outputs.susfs_version }}
          IMAGE_SHA: ${{ steps.build.outputs.image_sha256 }}
          ZIP_SHA: ${{ steps.build.outputs.zip_sha256 }}
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
        run: |
          set -euo pipefail
          echo "Kernel=$BUILT_KERNEL"
          echo "SukiSU=$BUILT_KSU"
          echo "SUSFS=$BUILT_SUSFS"
          echo "AK3=$ZIP_NAME"
          [[ "$BUILT_KERNEL" == *6.6.118* ]] || { echo "::error::Wrong kernel version"; exit 41; }
          [[ "$BUILT_SUSFS" == *2.3.0* ]] || { echo "::error::Wrong SUSFS version"; exit 42; }
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing kernel Image SHA-256"; exit 43; }
          [[ "$ZIP_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing AK3 SHA-256"; exit 44; }
          [[ -n "$ZIP_NAME" ]] || { echo "::error::No compiled AK3"; exit 45; }
          {
            echo "## OnePlus Ace 6 PLQ110 build"
            echo "- ROM tested against: ColorOS 16.0.10.500 (source match not established)"
            echo "- Kernel: $BUILT_KERNEL"
            echo "- SukiSU: $BUILT_KSU (pinned tag v4.2.1 / fd2a85151c8312fd9b4237db9ba827dcea692228)"
            echo "- SUSFS: $BUILT_SUSFS (a0f9c59e2243f8a5db955f4ad1686d5e0ad26e1a)"
            echo "- KPM: Disabled by upstream action"
            echo "- Image SHA256: $IMAGE_SHA"
            echo "- AK3 SHA256: $ZIP_SHA"
            echo "- Artifact: $ZIP_NAME"
            echo "- Device boot test: NOT PERFORMED"
            echo "- Stock ROM ABI: NOT VERIFIED (original source marked PLQ110 16.0.9.401)"
          } >> "$GITHUB_STEP_SUMMARY"
