name: Restart Updated OnePlus Mainline
run-name: restart-updated-mainline-${{ github.run_id }}

on:
  push:
    branches: [SukiSU-Ultra]
    paths: [.github/workflows/restart-mainline-updated.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: xm-mainline-updated-restart
  cancel-in-progress: true

jobs:
  restart:
    if: github.repository == 'Andyxyc/xm-ws'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cancel stale builds and dispatch updated builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import yaml

          repo = os.environ['GITHUB_REPOSITORY']
          ref = 'SukiSU-Ultra'
          sha = os.environ['GITHUB_SHA']
          workflow = 'Build Kernel OnePlus.yml'

          # These are the two stale source revisions currently running:
          # - previous remaining-device batch
          # - superseded OnePlus 13T diagnostic build
          stale_heads = {
              '1b5ed0d170e00d0148c624342287f2624654d4d3',
              '35a73916fcf6071bab369819ce4cbf8d942ed9c0',
          }

          def api(path, method='GET', payload=None, allow_fail=False):
              args = [
                  'gh', 'api', path,
                  '-H', 'Accept: application/vnd.github+json',
                  '-H', 'X-GitHub-Api-Version: 2022-11-28',
              ]
              data = None
              if method != 'GET':
                  args += ['--method', method]
              if payload is not None:
                  args += ['--input', '-']
                  data = json.dumps(payload)
              result = subprocess.run(args, input=data, capture_output=True, text=True, timeout=90)
              if result.returncode and not allow_fail:
                  raise RuntimeError(f'GitHub API failed ({path}): {result.stderr[-2000:]}')
              if result.returncode:
                  return {}
              return json.loads(result.stdout) if result.stdout.strip() else {}

          # Cancel stale queued/running Build runs so the new HMBIRD/status logic is used consistently.
          runs = api(f'repos/{repo}/actions/runs?per_page=100').get('workflow_runs', [])
          cancelled = []
          for run in runs:
              if run.get('path') != '.github/workflows/Build Kernel OnePlus.yml':
                  continue
              if run.get('head_sha') not in stale_heads:
                  continue
              if run.get('status') not in {'queued', 'in_progress', 'pending', 'waiting', 'requested'}:
                  continue
              rid = run['id']
              api(f'repos/{repo}/actions/runs/{rid}/cancel', method='POST', allow_fail=True)
              cancelled.append(rid)
              print(f'cancel requested: {rid}', flush=True)

          # Give GitHub a short moment to process cancellation requests.
          if cancelled:
              time.sleep(8)

          source = Path('.github/workflows') / workflow
          doc = yaml.load(source.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
          fields = doc['on']['workflow_dispatch']['inputs']
          devices = fields['FILE']['options']

          # Reuse the already-completed pilot artifacts. OnePlus 13T is intentionally excluded
          # for now per owner request; its previously boot-tested package remains untouched.
          skip = {
              'oneplus_10_pro_b',
              'oneplus_11_b',
              'oneplus_12_b',
              'oneplus_13_b',
              'oneplus_15',
              'oneplus_pad_pro_b',
              'oneplus_13t_b',
          }

          values = {key: value.get('default', '') for key, value in fields.items()}
          values.update(
              SUSFS_CI='Release',
              KPM='KPM',
              SUSFS_META='',
              BUILD_TIME='-1',
              SOURCE_PROFILE='',
              KSU_META='main/builtin/xiaomo/70fa0e092a2c81060823f8ae526eac14fdda2930',
              LZ4_UPDATE='false',
              ZRAM='0/lz4kd/8589934592',
              SUFFIX='-1',
              FAST_BUILD='true',
              LSM_BBG='false',
              NETFILTER='true',
              CCM='false',
              UNICODE_BYPASS='true',
              SCHED_HMBIRD='true',
              DROID_SPACES='false',
              RE_KERNEL='false',
              SUSFS_DEV='false',
              SPACE_NOCLEAN='false',
              BUILD_NOCACHE='false',
          )

          remaining = [d for d in devices if d not in skip]
          if len(devices) != 58 or len(remaining) != 51:
              raise SystemExit(f'Unexpected device counts: all={len(devices)} remaining={len(remaining)}')

          receipts = {
              'restart_run': os.environ['GITHUB_RUN_ID'],
              'head_sha': sha,
              'cancel_requested': cancelled,
              'skip': sorted(skip),
              'remaining_count': len(remaining),
              'runs': [],
          }
          out = Path('batch-receipts')
          out.mkdir(exist_ok=True)
          receipt_path = out / 'restart-updated-runs.json'

          def save():
              receipt_path.write_text(json.dumps(receipts, ensure_ascii=False, indent=2), encoding='utf-8')

          save()
          for idx, device in enumerate(remaining, 1):
              payload = {
                  'ref': ref,
                  'inputs': dict(values, FILE=device),
                  'return_run_details': True,
              }
              response = api(
                  f'repos/{repo}/actions/workflows/Build%20Kernel%20OnePlus.yml/dispatches',
                  method='POST',
                  payload=payload,
              )
              rid = response.get('workflow_run_id')
              if type(rid) is not int or rid <= 0:
                  raise RuntimeError(f'Missing workflow run id for {device}')
              receipts['runs'].append({
                  'device': device,
                  'run_id': rid,
                  'url': response.get('html_url'),
              })
              save()
              print(f'[{idx}/{len(remaining)}] {device}: {rid}', flush=True)
              time.sleep(2)

          print(f'updated mainline dispatched: {len(remaining)} builds; 13T skipped', flush=True)
          PY

      - name: Keep restart receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restart-updated-receipts-${{ github.run_id }}
          path: batch-receipts/
          if-no-files-found: warn
          retention-days: 7
