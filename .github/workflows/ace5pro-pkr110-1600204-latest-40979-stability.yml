name: Ace5Pro PKR110 Android16 6.6.66 pinned SukiSU SUSFS KPM stability trial
run-name: Ace5Pro-1600204-SukiSU40979-KPM-SUSFS-UNTESTED-${{ github.run_id }}

on:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/ace5pro-pkr110-1600204-latest-40979-stability.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ace5pro-1600204-kpm-susfs
  cancel-in-progress: false

jobs:
  build-minimal-ace5pro:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout pinned prep and installer
        uses: actions/checkout@v4
        with:
          ref: SukiSU-Ultra
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare reduced 6.6.66 source builder
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 \
            https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8750/0d90ea459dd5013ba5b1cb2e1ebc8c6d1544d746/local/builder_6.6.66.sh \
            -o ace5pro-minimal-builder.sh
          python -m py_compile scripts/ace5pro_minimal_susfs_prepare.py
          python scripts/ace5pro_minimal_susfs_prepare.py ace5pro-minimal-builder.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ace5pro-minimal-builder.sh')
          s=p.read_text()
          old='70fa0e092a2c81060823f8ae526eac14fdda2930'
          new='6c284e957feaa9a388a9f1c37dc4ec80d95e434b'
          assert s.count(old)>=3, 'Unexpected SukiSU setup source pin'
          s=s.replace(old,new)
          # Remote SUSFS branch head drifted; fetch exact reviewed SUSFS commit.
          pinned_susfs='0730de4f5d46ee2997f953101b0f608c0b400b38'
          check='test "$(git -C susfs4ksu rev-parse HEAD)" = "'+pinned_susfs+'"'
          if s.count(check)!=1:
              raise SystemExit('SUSFS pin check location changed')
          s=s.replace(check,
              'git -C susfs4ksu fetch origin '+pinned_susfs+' --depth=1\n'
              '  git -C susfs4ksu checkout --detach '+pinned_susfs+'\n'
              '  '+check,1)
          lines=s.splitlines()
          out=[]; skip=False; removed=0
          for ln in lines:
              if "if grep -q '^KSU_VERSION_FULL := '" in ln:
                  assert not skip
                  skip=True; removed+=1; continue
              if skip:
                  if ln.strip()=='fi': skip=False
                  continue
              if "sed -i 's|^KSU_VERSION" in ln or "sed -i 's|^VERSION_TAG" in ln:
                  removed+=1; continue
              out.append(ln)
          assert not skip and removed==3, 'Legacy fake version lines not fully removed'
          s='\n'.join(out)+'\n'
          marker='# ===== 编译内核 ====='
          assert s.count(marker)==1
          extra='''# Enable source-integrated KPM rather than patching the binary Image.
          echo "CONFIG_KPM=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_FILE"
          '''
          s=s.replace(marker,extra+marker,1)
          p.write_text(s)
          print('Pinned builtin SukiSU source, no fabricated version, native KPM enabled')
          PY
          bash -n ace5pro-minimal-builder.sh
          sh -n templates/ace5pro_minimal_susfs_anykernel.sh
          echo "Validated pinned SukiSU source + SUSFS + native KPM; vendor scheduler unchanged."

      - name: Compile source-matched 6.6.66 with only core SukiSU and SUSFS
        env:
          MANIFEST: OnePlus_Ace5Pro_PKR110_Android16_TEST
        run: |
          set -euo pipefail
          # Input order matches pinned builder prompts, all optional patches OFF:
          # 1 kernel suffix; 2 SUSFS; 3 KPM; 4 pinned SukiSU;
          # 5 LZ4/ZSTD; 6 LZ4KD; 7 network; 8 BBR; 9 DroidSpaces;
          # 10 ADIOS; 11 RE-Kernel; 12 BBG.
          printf '%s\n' \
            'android15-8-g29d86c5fc9dd-abogki428889875-4k' \
            'y' \
            'n' \
            'y' \
            'n' \
            'n' \
            'n' \
            'n' \
            'n' \
            'n' \
            'n' \
            'n' \
            | bash ./ace5pro-minimal-builder.sh

      - name: Check final image identity and actually enabled kernel options
        run: |
          set -euo pipefail
          COMMON="$GITHUB_WORKSPACE/kernel_workspace/common"
          OUT="$COMMON/out"
          IMAGE="$OUT/arch/arm64/boot/Image"
          test -s "$IMAGE"
          test "$(stat -c %s "$IMAGE")" -gt 6000000
          test -s "$OUT/.config"
          # The manager enables Superuser and Module tabs only when UAPI 5 is real.
          KSU="$GITHUB_WORKSPACE/kernel_workspace/KernelSU/kernel"
          test -s "$KSU/include/uapi/supercall.h"
          grep -qF "KERNEL_SU_UAPI_VERSION, 5" "$KSU/include/uapi/supercall.h" || {
            echo "::error::Kernel UAPI is not 5; manager 40979-5 would refuse Superuser/Modules"
            exit 60
          }
          grep -qF "KSU_GET_INFO_FLAG_BUNDLED" "$KSU/include/uapi/supercall.h"
          grep -qF "KSU_DRIVER_PERMISSION_SU_SESSION" "$KSU/supercall/supercall.c"
          grep -qF "EVENT_SERVICES" "$KSU/supercall/dispatch.c"
          test -s "$GITHUB_WORKSPACE/kernel_workspace/AnyKernel3/tools/ak3-core.sh"
          for opt in CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_HMBIRD_SCHED=y CONFIG_KPM=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y; do
            grep -qxF "$opt" "$OUT/.config" || {
              echo "::error::Required kernel option missing: $opt"
              exit 50
            }
          done
          for bad in CONFIG_MQ_IOSCHED_ADIOS=y CONFIG_BBG=y CONFIG_REKERNEL=y; do
            if grep -qxF "$bad" "$OUT/.config"; then
              echo "::error::Unexpected addon config: $bad"
              exit 51
            fi
          done
          strings -a "$IMAGE" | grep -m1 '^Linux version 6\.6\.66-' || {
            echo "::error::Image kernel base does not match stock 6.6.66"
            exit 52
          }
          cmp "$IMAGE" "$GITHUB_WORKSPACE/kernel_workspace/AnyKernel3/Image" || {
            echo "::error::Built Image differs from AnyKernel3 Image"
            exit 53
          }
          test "$(git -C "$GITHUB_WORKSPACE/kernel_workspace/KernelSU" rev-parse HEAD)" = "6c284e957feaa9a388a9f1c37dc4ec80d95e434b"
          echo "PASS: built Image / source / KPM / SUSFS. Vendor ABI and actual device boot NOT verified."

      - name: Package STRICT model-checked AK3 without any extra modules
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/kernel_workspace/AnyKernel3"
          cp "$GITHUB_WORKSPACE/templates/ace5pro_minimal_susfs_anykernel.sh" "$BASE/anykernel.sh"
          chmod 755 "$BASE/anykernel.sh"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kernel_workspace/AnyKernel3/anykernel.sh')
          s=p.read_text()
          s=s.replace('SukiSU Ultra 40959 + SUSFS minimal STABILITY TRIAL',
                      'Pinned SukiSU + native KPM + SUSFS test')
          s=s.replace('kernel.string=Ace5Pro 6.6.66 SukiSU40959 SUSFS ONLY - TEST',
                      'kernel.string=Ace5Pro PKR110 6.6.66 SukiSU SUSFS KPM - UNTESTED')
          start=s.index('ui_print "================================================"')
          end=s.index('ui_print "================================================"',start+1)+len('ui_print "================================================"')
          msg='''ui_print "================================================"
          ui_print " 一加 Ace 5 Pro / PKR110 / Android 16"
          ui_print " 目标：PKR110_16.0.0.204(CN01)"
          ui_print " 内核：6.6.66 / SukiSU 管理器：40979"
          ui_print " KPM: Enabled"
          ui_print " SUSFS: Enabled"
          ui_print " 保留原厂调度，不添加额外调度补丁"
          ui_print " 作者：闲心中都是莫"
          ui_print " 注意：仅为测试候选，原厂 ABI 和开机未验证"
          ui_print "================================================"'''
          s=s[:start]+msg+s[end:]
          suffix='6.6.66-android15-8-g29d86c5fc9dd-abogki428889875-4k'
          assert '  6.6.66-android15-8-*) ;;' in s
          s=s.replace('  6.6.66-android15-8-*) ;;',f'  {suffix}) ;;')
          assert '40959' not in s
          p.write_text(s)
          PY
          sha256sum "$BASE/Image" | awk '{print $1 "  Image"}' > "$BASE/kernel-image.sha256"
          sh -n "$BASE/anykernel.sh"
          # No separate SUSFS module is automatically installed; SUSFS
          # support comes only from the compiled kernel.
          test -s "$BASE/Image"
          test -s "$BASE/tools/ak3-core.sh"
          test ! -e "$BASE/kpn.zip"
          test ! -e "$BASE/zram.zip"
          test ! -e "$BASE/ksu_module_susfs.zip"
          test ! -e "$BASE/patch_linux"
          cat > "$BASE/minimal-susfs-test-info.txt" <<'EOF'
          TARGET=OnePlus Ace 5 Pro
          DEVICE=PKR110
          CODENAME=OP60EBL1
          OS=Android 16
          STOCK_KERNEL_BASE=6.6.66
          GKI_KMI=android15-6.6
          SUKISU_MANAGER=40979
          SUKISU_SOURCE=6c284e957feaa9a388a9f1c37dc4ec80d95e434b
          SUKISU_UAPI=5
          BUILTIN_UAPI_CAPABILITY=verified
          SUSFS=builtin_minimal
          KPM=builtin_enabled
          ADIOS=disabled
          BBG=disabled
          UNICODE_AND_FUSE_EXTRA_PATCH=disabled
          COMPRESSOR_AND_NETWORK_EXTRA_PATCH=disabled
          OEM_HMBIRD_SCHEDULER_SOURCE=preserved
          SERIAL_BINDING=none
          PRODUCTION_RELEASE=no
          REAL_DEVICE_STABILITY_TEST=not_performed
          AUTHOR=闲心中都是莫
          EOF
          ZIP_NAME="Ace5Pro_PKR110_16.0.0.204_6.6.66_SukiSU40979Manager_SUSFS_KPM_UNTESTED_run${GITHUB_RUN_ID}.zip"
          (
            cd "$BASE"
            zip -q -r "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git/*'
          )
          unzip -t "$ZIP_NAME" | tail -n 2
          ZIP_NAME="$ZIP_NAME" python3 - <<'PY'
          import os,zipfile
          zpath=os.environ['ZIP_NAME']
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None, 'ZIP CRC failure'
              members=set(z.namelist())
              for item in ['anykernel.sh','Image','kernel-image.sha256','tools/ak3-core.sh','minimal-susfs-test-info.txt']:
                  assert item in members, f'missing entry {item}'
              assert all('kpn' not in p.lower() for p in members), 'unexpected KPN'
              metadata=z.read('minimal-susfs-test-info.txt').decode()
              assert 'SUSFS=builtin_minimal' in metadata
              assert 'SUKISU_UAPI=5' in metadata
              assert 'BUILTIN_UAPI_CAPABILITY=verified' in metadata
              assert 'KPM=builtin_enabled' in metadata
          print('PASS: static AK3/CRC/SUSFS/KPM metadata only; boot remains UNTESTED')
          PY
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          echo "FINAL_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Created UNTESTED trial: $ZIP_NAME"

      - name: Save test artifact and SHA256 (no cloud release)
        uses: actions/upload-artifact@v4
        with:
          name: Ace5Pro_PKR110_1600204_SukiSU40979_SUSFS_KPM_UNTESTED_${{ github.run_id }}
          path: |
            ${{ env.FINAL_ZIP }}
            ${{ env.FINAL_ZIP }}.sha256
          if-no-files-found: error
          retention-days: 15
          compression-level: 0
