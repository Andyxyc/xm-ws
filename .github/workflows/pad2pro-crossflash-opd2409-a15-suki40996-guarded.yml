name: Pad2Pro OPD2413 hardware OPD2409 crossflash A15 SukiSU40996 KPM SUSFS guarded
run-name: OPD2413-on-OPD2409-6.6.57-SukiSU40996-CANDIDATE-${{ github.run_id }}
on:
  workflow_dispatch:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/pad2pro-crossflash-opd2409-a15-suki40996-guarded.yml
      - scripts/build_pad2pro_opd2409_crossflash.py
      - scripts/pad2pro_sukisu40996_compat.py
      - scripts/pad2pro_susfs_rebase.py
      - scripts/test_pad2pro_susfs_rebase.py
      - templates/anykernel_pad2pro_opd2409_crossflash_guarded.sh
permissions:
  contents: read
concurrency:
  group: pad2pro-crossflash-opd2409-1501501-40996
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate build and installer syntax
        run: |
          set -euo pipefail
          mkdir -p pad2pro_diagnostics
          python3 -m py_compile scripts/build_pad2pro_opd2409_crossflash.py scripts/pad2pro_sukisu40996_compat.py scripts/pad2pro_susfs_rebase.py scripts/test_pad2pro_susfs_rebase.py
          python3 scripts/build_pad2pro_opd2409_crossflash.py selftest 2>&1 | tee pad2pro_diagnostics/selftest.log
          dash -n templates/anykernel_pad2pro_opd2409_crossflash_guarded.sh
          bash -n scripts/ace5pro_fix_uapi5.sh
      - name: Install compilation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make gcc g++ bison flex bc libssl-dev libelf-dev zlib1g-dev dwarves cpio xz-utils zip unzip lz4 zstd python3 curl
          df -h . | tee pad2pro_diagnostics/disk.log
      - name: Prepare official OPD2413 sources and latest pinned SukiSU
        run: |
          set -euo pipefail
          python3 -u scripts/build_pad2pro_opd2409_crossflash.py prepare 2>&1 | tee pad2pro_diagnostics/prepare.log
      - name: Build OPD2413 6.6.57 source reference (NOT OPD2409 live ABI)
        run: |
          set -euo pipefail
          python3 -u scripts/build_pad2pro_opd2409_crossflash.py stock 2>&1 | tee pad2pro_diagnostics/stock.log
      - name: Build pinned latest SukiSU 40996 KPM SUSFS and compare SOURCE ABI only
        run: |
          set -euo pipefail
          python3 -u scripts/build_pad2pro_opd2409_crossflash.py custom 2>&1 | tee pad2pro_diagnostics/custom.log
      - name: Package GUARDED NONFLASH artifact after source-only ABI gates
        run: |
          set -euo pipefail
          cp templates/anykernel_pad2pro_opd2409_crossflash_guarded.sh pad2pro_work/ak3/anykernel.sh
          chmod 755 pad2pro_work/ak3/anykernel.sh
          dash -n pad2pro_work/ak3/anykernel.sh
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          base=Path('pad2pro_work/ak3')
          diag=Path('pad2pro_diagnostics')
          result=json.loads((diag/'custom-build.json').read_text())
          if result['abi_gate'] != 'passed_source_only':
              raise SystemExit('Kernel ABI verification did not pass')
          version=json.loads((diag/'sukisu-version.json').read_text())['version']
          if version != 40996:
              raise SystemExit('Expected official SukiSU 40996 source count, got '+str(version))
          for p in ['Image','anykernel.sh','tools/ak3-core.sh','META-INF/com/google/android/update-binary']:
              if not (base/p).is_file() or (base/p).stat().st_size == 0:
                  raise SystemExit('Missing required AK3 file: '+p)
          digest=hashlib.sha256((base/'Image').read_bytes()).hexdigest()
          if digest != result['image_sha256']:
              raise SystemExit('Packaged Image differs from checked KPM output')
          (base/'Image.sha256').write_text(digest+'  Image\n')
          info=json.loads((diag/'sources.json').read_text())
          info.update(sukisu_version=version, kpm='enabled', susfs='v2.3.0',
                      abi_gate='ONEPLUS_STOCK_SOURCE_ONLY_NOT_OPPO_LIVE',
                      source_platform='OnePlus Pad 2 Pro OPD2413 .701 6.6.57',
                      current_firmware='OPPO Pad 4 Pro OPD2409_15.0.1.501(CN01)',
                      screenshot_kernel_release='6.6.57-android15-8-g443be96c6b96d-4k',
                      exact_firmware_kernel_source='UNAVAILABLE',
                      live_device_vendor_module_abi='NOT_CHECKED',
                      stock_boot_img='NOT_ACQUIRED', device_boot_test='not_performed',
                      firmware_compatibility='UNVERIFIED',
                      flash_operation='BLOCKED_BY_ANYKERNEL_INSTALLER')
          (base/'build-info.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          out=Path('pad2pro_dist'); out.mkdir()
          target=out/f'OPD2413Hardware_OPD2409Rom_15.0.1.501_6.6.57_SukiSU{version}_KPM_SUSFS_GUARDED_NOT_FOR_FLASH_{os.environ["GITHUB_RUN_ID"]}.zip'
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(base.rglob('*')):
                  rel=p.relative_to(base)
                  if '.git' not in rel.parts and p.is_file():
                      z.write(p,rel.as_posix())
          with zipfile.ZipFile(target) as z:
              if z.testzip() is not None:
                  raise SystemExit('ZIP CRC verification failed')
              if hashlib.sha256(z.read('Image')).hexdigest() != digest:
                  raise SystemExit('Image content failed ZIP readback')
          checksum=hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_suffix('.zip.sha256').write_text(checksum+'  '+target.name+'\n')
          print('Artifact:',target)
          print('SukiSU:',version)
          print('SHA256:',checksum)
          installer=(base/'anykernel.sh').read_text(encoding='utf-8')
          required=['OPD2409_15.0.1.501(CN01)','KPM：Enabled','SUSFS：Enabled',
                    '作者：闲心中都是莫','abort "跨刷设备的原厂启动镜像和厂商 ABI 未核实']
          for phrase in required:
              if phrase not in installer:
                  raise SystemExit('Missing fail-closed guard or correct banner: '+phrase)
          forbidden=('split_boot\n','write_boot\n','flash_boot\n','dd if=')
          for phrase in forbidden:
              for ln in installer.splitlines():
                  if not ln.lstrip().startswith('#') and phrase.strip() in ln:
                      raise SystemExit('Unexpected actual write operation in guard script')
          print('PASS: no-flash guard present; OPPO .501 vendor ABI and boot not checked')
          PY
      - name: Preserve complete diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pad2Pro-OPD2409-CROSSFLASH-diagnostics-${{ github.run_id }}
          path: pad2pro_diagnostics/
          if-no-files-found: error
          retention-days: 30
      - name: Upload source-only candidate with permanent nonflash guard
        uses: actions/upload-artifact@v4
        with:
          name: Pad2Pro-OPD2409-CROSSFLASH-40996-GUARDED-NOFLASH-${{ github.run_id }}
          path: pad2pro_dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
