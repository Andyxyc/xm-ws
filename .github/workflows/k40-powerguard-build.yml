name: K40 event power guard build v1.0
on:
  push:
    branches: [codex/k40-battery-senior-20261126]
    paths: [.github/workflows/k40-powerguard-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Compile owner rest reminder without online dependencies
        run: |
          set -euo pipefail
          mkdir guard delivery
          python3 - <<'PY2'
          import pathlib,zipfile,io,base64,hashlib
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='82e12bf97690b1c5cd465d58174913abbe34fbf530e07601c628ef1ca744c0da'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:z.extractall('guard')
          PY2
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          android_jar="$(find "$sdk/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir guard/classes guard/dex guard/tests
          javac -d guard/tests guard/PowerPolicy.java guard/PowerPolicyTest.java
          java -cp guard/tests local.k40.powerguard.PowerPolicyTest
          mkdir guard/hidden
          javac -classpath "$android_jar" -d guard/hidden guard/UEventObserver.java
          jar cf guard/hidden.jar -C guard/hidden .
          javac -source 17 -target 17 -classpath "$android_jar:guard/hidden.jar" -d guard/classes guard/PowerPolicy.java guard/ChargeBridge.java guard/PowerGuard.java
          "$tools/d8" --min-api 33 --lib "$android_jar" --classpath guard/hidden.jar --output guard/dex $(find guard/classes -name '*.class')
          "$tools/aapt2" link -I "$android_jar" --manifest guard/AndroidManifest.xml -o guard/unsigned.apk
          (cd guard/dex && zip ../unsigned.apk classes.dex)
          "$tools/zipalign" -p 4 guard/unsigned.apk delivery/K40-PowerGuard-unsigned.apk
          cp "$tools/lib/apksigner.jar" delivery/
          cp guard/dex/classes.dex delivery/
          sha256sum delivery/* > delivery/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: K40-PowerGuard-unsigned
          path: delivery/
          retention-days: 7