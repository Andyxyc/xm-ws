name: Lanzou OnePlus SukiSU AK3 Pilot 20261009
on:
  push:
    branches: [SukiSU-Ultra]
    paths:
      - .github/workflows/lanzou-ak3-pilot-20261009.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lanzou-ak3-pilot-20261009
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          ref: SukiSU-Ultra
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate credentials exist
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LANZOU_YLOGIN" || -z "$LANZOU_PHPDISK_INFO" ]]; then
            echo "::error::One or both LanZouCloud credentials missing in Actions secrets"
            exit 2
          fi
          python -m py_compile scripts/publish_lanzou_ak3.py
          echo "Credentials configured and script passes syntax check"

      - name: Install pinned upload client
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'requests==2.32.5' 'requests-toolbelt==1.0.0' 'setuptools'
          python -m pip install --disable-pip-version-check --no-cache-dir --no-build-isolation \
            'git+https://github.com/zaxtyson/LanZouCloud-API.git@3bb917f6baf873d83b1e8e6fb2df74c60c4d8cb3'

      - name: Upload one completed unbound AK3 and verify cloud metadata
        env:
          GH_TOKEN: ${{ github.token }}
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python scripts/publish_lanzou_ak3.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id 37884290075
