name: OnePlus Ace6 PLQ110 official 6.6.118 SUSFS source preflight
run-name: Ace6-PLQ110-ColorOS16-6.6.118-preflight-${{ github.run_id }}
on:
  push:
    branches: [ace6-plq110-coloros16-20261016]
    paths:
      - .github/workflows/ace6-plq110-susfs-source-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ace6-plq110-susfs-source-preflight
  cancel-in-progress: false
jobs:
  source-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed Ace6 official source references
        run: |
          set -euo pipefail
          mkdir -p ace6-evidence
          for entry in \
            "android_kernel_common_oneplus_sm8750:65b954a773b183a9999b06bb1b2f921f12eaaf11" \
            "android_kernel_oneplus_sm8750:affd9c73e846c6a0e4c8d564f5baedd448a65570" \
            "android_kernel_modules_and_devicetree_oneplus_sm8750:b8d60e4ca773ae7ffcfa62fe9611f2454561b556"; do
            name="$(printf '%s' "$entry" | cut -d: -f1)"
            expected="$(printf '%s' "$entry" | cut -d: -f2)"
            remote="https://github.com/OnePlusOSS/$name.git"
            got="$(git ls-remote "$remote" 'refs/heads/oneplus/sm8750_b_16.0.0_ace_6' | awk '{print $1}')"
            echo "$name $got" | tee -a ace6-evidence/pins.txt
            [ "$got" = "$expected" ] || { echo "::error::Official Ace6 branch changed ($name)"; exit 32; }
          done
          git init -q ace6-official-common
          git -C ace6-official-common remote add origin https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750.git
          git -C ace6-official-common fetch -q --depth=1 origin 65b954a773b183a9999b06bb1b2f921f12eaaf11
          git -C ace6-official-common checkout -q --detach FETCH_HEAD
          test "$(git -C ace6-official-common rev-parse HEAD)" = 65b954a773b183a9999b06bb1b2f921f12eaaf11
          grep -qx 'VERSION = 6' ace6-official-common/Makefile
          grep -qx 'PATCHLEVEL = 6' ace6-official-common/Makefile
          grep -qx 'SUBLEVEL = 118' ace6-official-common/Makefile
          test -s ace6-official-common/arch/arm64/configs/gki_defconfig
          echo 'PLQ110_16.0.10.500(CN01B110P02) screenshot; vendor module ABI not yet matched' >> ace6-evidence/firmware.txt
      - name: Source-lock SukiSU builtin and SUSFS 2.3.0
        run: |
          set -euo pipefail
          git init -q ace6-suki
          git -C ace6-suki remote add origin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          git -C ace6-suki fetch -q --depth=1 origin c95d6e2c76adb11b0e438e518e32ac4e31f5b1d0
          git -C ace6-suki checkout -q --detach FETCH_HEAD
          test "$(git -C ace6-suki rev-parse HEAD)" = c95d6e2c76adb11b0e438e518e32ac4e31f5b1d0
          grep -q 'config KPM' ace6-suki/kernel/Kconfig
          grep -q 'config KSU_SUSFS' ace6-suki/kernel/Kconfig
          git init -q ace6-susfs
          git -C ace6-susfs remote add origin https://github.com/ShirkNeko/susfs4ksu.git
          git -C ace6-susfs fetch -q --depth=1 origin 2d11d711de80f0f749b3055f8da8f7b9682454e4
          git -C ace6-susfs checkout -q --detach FETCH_HEAD
          test "$(git -C ace6-susfs rev-parse HEAD)" = 2d11d711de80f0f749b3055f8da8f7b9682454e4
          test -s ace6-susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch
          grep -q '^version=v2.3.0' ace6-susfs/ksu_module_susfs/module.prop
          grep -nE 'ksu_su_compat_enabled|ksu_is_input_hook_enabled|ksu_is_init_rc_hook_enabled' \
            ace6-susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch \
            | head -n 15 | tee ace6-evidence/susfs-hook-abi.txt || true
      - name: Strict zero-fuzz SUSFS patch compatibility test
        run: |
          set -euo pipefail
          patchfile="$GITHUB_WORKSPACE/ace6-susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          if ! (cd ace6-official-common && patch --batch --forward --fuzz=0 -p1 --dry-run < "$patchfile") > ace6-evidence/susfs-dryrun.log 2>&1; then
            tail -n 150 ace6-evidence/susfs-dryrun.log
            echo "::error::Official PLQ110 6.6.118 differs from generic SUSFS v2.3.0 hunks. No unsafe partial patch permitted."
            exit 40
          fi
          echo "STOCK_COMMON_PATCH_DRYRUN=PASS" >> ace6-evidence/firmware.txt
          echo "SUSFS_SOURCE_PIN=2d11d711de80f0f749b3055f8da8f7b9682454e4" >> ace6-evidence/firmware.txt
          echo "SUKISU_BUILTIN_PIN=c95d6e2c76adb11b0e438e518e32ac4e31f5b1d0" >> ace6-evidence/firmware.txt
          echo "ABI_LIVE_VENDOR_MODULES=NOT_VERIFIED" >> ace6-evidence/firmware.txt
      - name: Upload source compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ace6-PLQ110-6.6.118-SUSFS-source-evidence-${{ github.run_id }}
          path: ace6-evidence/
          if-no-files-found: warn
          retention-days: 20
